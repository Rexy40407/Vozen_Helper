<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vozen preview harness</title>
    <link rel="stylesheet" href="../site/module-previews.css">
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #07101b; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; margin: 0; padding: 28px; color: #e7f1ff; background: radial-gradient(circle at 50% 0, #12253a, #07101b 55%); }
      main { width: min(860px, 100%); margin: 0 auto; }
      .harness-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
      .harness-toolbar h1 { margin: 0; font-size: 18px; }
      .harness-toolbar p { margin: 4px 0 0; color: #8da6bf; font-size: 12px; }
      .harness-toolbar button { min-height: 38px; padding: 0 14px; border: 1px solid #3a6687; border-radius: 8px; background: #102238; color: #dceafb; font-weight: 700; cursor: pointer; }
      .vozen-signal-stage { width: 100%; }
    </style>
  </head>
  <body>
    <main>
      <div class="harness-toolbar">
        <div><h1 data-preview-module></h1><p data-preview-availability></p></div>
      <button id="open-preview" type="button">Open preview</button>
      </div>
      <div class="vozen-signal-stage" data-harness-stage></div>
    </main>
    <script type="module">
      import { getPreviewDefinition } from "../site/module-previews.js";
      import { openModulePreview, renderPreviewScene } from "../site/module-preview-player.js";

      const params = new URLSearchParams(location.search);
      const moduleId = params.get("module") || "management.polls";
      const beat = Math.max(0, Number(params.get("beat") || 0));
      const definition = getPreviewDefinition(moduleId);
      if (!definition) throw new Error(`Unknown definition: ${moduleId}`);
      document.title = `${definition.title} · Harness`;
      document.querySelector("[data-preview-module]").textContent = definition.title;
      document.querySelector("[data-preview-availability]").textContent = `${definition.id} · ${definition.availability} · ${definition.renderer}`;
      const stage = document.querySelector("[data-harness-stage]");
      stage.innerHTML = renderPreviewScene(definition);
      stage.dataset.module = definition.id;
      stage.dataset.beat = String(beat);
      stage.querySelectorAll("[data-beat]").forEach((item) => {
        const itemBeat = Number(item.dataset.beat);
        item.classList.toggle("is-active", itemBeat === beat);
        item.classList.toggle("is-complete", itemBeat < beat || beat === definition.stages.length - 1);
      });
      document.querySelector("#open-preview").addEventListener("click", (event) => openModulePreview({ definition, title: definition.title, trigger: event.currentTarget }));
    </script>
  </body>
</html>
