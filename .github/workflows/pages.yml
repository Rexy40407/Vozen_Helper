name: Deploy site to GitHub Pages

# Publica o site em GitHub Pages, MINIFICADO. O passo build:site gera site-dist/ a
# partir de site/ (index.html + css minificados; privacy/terms ficam legíveis) e é
# essa pasta que se publica. O configure-pages (enablement: true) LIGA o Pages sozinho
# na 1ª corrida. Cada push a main que altere site/ ou o script de build redeploya.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.mjs'
      - 'tools/minify-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma só publicação de cada vez; não cancela um deploy a meio.
concurrency:
  group: pages
  # A protected environment can leave an old run waiting indefinitely. A
  # newer verified commit must be able to replace that stale deployment.
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install chromium
      - name: Run Node and browser preview tests
        run: npm run test:all

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build minified site (site/ -> site-dist/)
        run: npm run build:site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # A rerun keeps the same workflow run but increments run_attempt.
          # Include both values so deploy-pages never sees duplicate artifacts.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site-dist
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          # GitHub Pages can leave a deployment queued during provider load.
          # Allow the service 30 minutes before cancelling the poll.
          timeout: 1800000
